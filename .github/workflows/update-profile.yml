name: Update GitHub Profile Activity

on:
  schedule:
    # Runs automatically every day at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows manual trigger from the GitHub Actions UI

permissions:
  contents: write

jobs:
  refresh-profile:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: 'scripts/requirements.txt'

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: 📡 Fetch public GitHub contributions (Zero Tokens)
        run: |
          python scripts/fetch_contributions.py Kekkan74 data/contributions.json

      - name: 🛰️ Fetch recent commits & telemetry stream
        run: |
          python scripts/fetch_activity.py Kekkan74 data/activity.json

      - name: 🎨 Render animated contribution heatmap SVG
        run: |
          python scripts/render_heatmap_svg.py data/contributions.json contrib-heatmap.svg

      - name: ⚡ Render live commit activity stream SVG
        run: |
          python scripts/render_commit_activity_svg.py data/activity.json commit-activity.svg

      - name: 🚀 Commit and push if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add data/contributions.json data/activity.json contrib-heatmap.svg commit-activity.svg
          
          if git diff --staged --quiet; then
            echo "⚡ No changes detected in contribution data or SVGs."
          else
            git commit -m "chore(profile): daily heatmap & telemetry refresh [skip ci]"
            git push
            echo "✅ Successfully updated profile heatmap and commit activity on GitHub."
          fi
