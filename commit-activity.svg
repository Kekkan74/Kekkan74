<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 295" width="100%" height="100%">
  <defs>
    <linearGradient id="term-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e14"/>
      <stop offset="100%" stop-color="#05080c"/>
    </linearGradient>
    <linearGradient id="term-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#1f2937" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#00ff66" stop-opacity="0.35"/>
    </linearGradient>
    <filter id="neon-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <style>
    .terminal-bg { fill: url(#term-bg); stroke: url(#term-border); stroke-width: 1.5; rx: 10; }
    .header-bar  { fill: #111822; }
    .header-title { font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace; font-size: 11.5px; fill: #6b7280; font-weight: 600; }
    .dot-red    { fill: #ff5f56; }
    .dot-yellow { fill: #ffbd2e; }
    .dot-green  { fill: #27c93f; }

    .pulse-dot {
      animation: blinkDot 1.8s infinite;
    }
    @keyframes blinkDot {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.25; }
    }

    .cursor-blink {
      animation: blinkCursor 1s infinite;
    }
    @keyframes blinkCursor {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    .hud-label  { font-family: 'JetBrains Mono', monospace; font-size: 10.5px; fill: #64748b; font-weight: 600; }
    .hud-val-c  { font-family: 'JetBrains Mono', monospace; font-size: 10.5px; fill: #00e5ff; font-weight: 700; }
    .hud-val-g  { font-family: 'JetBrains Mono', monospace; font-size: 10.5px; fill: #00ff66; font-weight: 700; }

    .col-header { font-family: 'JetBrains Mono', monospace; font-size: 9.5px; fill: #475569; font-weight: 700; letter-spacing: 0.5px; }
    .log-date   { font-family: 'JetBrains Mono', monospace; font-size: 10px; fill: #94a3b8; }
    .log-repo   { font-family: 'JetBrains Mono', monospace; font-size: 10px; fill: #f1f5f9; font-weight: 600; }
    .log-sha    { font-family: 'JetBrains Mono', monospace; font-size: 10px; fill: #64748b; }
    .log-msg    { font-family: 'JetBrains Mono', monospace; font-size: 10px; fill: #cbd5e1; }

    .badge-txt  { font-family: 'JetBrains Mono', monospace; font-size: 8.5px; font-weight: 700; text-anchor: middle; }
    .bottom-cmd { font-family: 'JetBrains Mono', monospace; font-size: 10px; fill: #00ff66; }
    .bottom-dim { font-family: 'JetBrains Mono', monospace; font-size: 10px; fill: #475569; }
  </style>
  <rect x="2" y="2" width="856" height="291" class="terminal-bg"/>
  <path d="M 2 12 C 2 6 6 2 12 2 L 848 2 C 854 2 858 6 858 12 L 858 32 L 2 32 Z" class="header-bar"/>
  <circle cx="18" cy="17" r="5" class="dot-red"/>
  <circle cx="33" cy="17" r="5" class="dot-yellow"/>
  <circle cx="48" cy="17" r="5" class="dot-green"/>
  <text x="430" y="21" text-anchor="middle" class="header-title">kekkan74@soc-node: ~ (tail -f /var/log/audit/git_events.log)</text>
  <circle cx="768" cy="17" r="3.5" fill="#00ff66" class="pulse-dot"/>
  <text x="778" y="20.5" font-family="JetBrains Mono, monospace" font-size="9px" fill="#00ff66" font-weight="700">AUDIT_LIVE</text>
  <line x1="24" y1="52" x2="836" y2="52" stroke="#1f2937" stroke-width="0.8"/>
  <text x="28" y="46"><tspan class="hud-label">[MONITORED_NODES] </tspan><tspan class="hud-val-c">4 REPOSITORIES  </tspan><tspan class="hud-label">[STATUS] </tspan><tspan class="hud-val-g">🟢 DEFENSE STREAM ACTIVE  </tspan><tspan class="hud-label">[TELEMETRY] </tspan><tspan class="hud-val-c">ZERO-TOKEN PARSED</tspan></text>
  <text x="28"  y="69" class="col-header">TIMESTAMP (UTC)</text>
  <text x="168" y="69" class="col-header">EVENT</text>
  <text x="248" y="69" class="col-header">REPOSITORY</text>
  <text x="365" y="69" class="col-header">SHA</text>
  <text x="435" y="69" class="col-header">PAYLOAD / AUDIT MESSAGE</text>
  <line x1="24" y1="75" x2="836" y2="75" stroke="#1e293b" stroke-width="0.8"/>
  <rect x="24" y="82" width="812" height="21" rx="4" fill="#0d141f" opacity="0.4"/>
  <text x="28" y="96" class="log-date">2026-10-28 04:57</text>
  <rect x="160" y="85" width="58" height="15" rx="3" fill="rgba(0, 229, 255, 0.15)" stroke="#00e5ff" stroke-width="0.6"/>
  <text x="189" y="96" class="badge-txt" fill="#00e5ff">SYNC</text>
  <text x="248" y="96" class="log-repo">Kekkan74</text>
  <text x="365" y="96" class="log-sha">9a2bafe</text>
  <text x="435" y="96" class="log-msg">chore(profile): daily heatmap &amp; stats refresh [sk...</text>
  <rect x="24" y="107" width="812" height="21" rx="4" fill="#0d141f" opacity="0.4"/>
  <text x="28" y="121" class="log-date">2026-05-17 14:16</text>
  <rect x="160" y="110" width="58" height="15" rx="3" fill="rgba(192, 132, 252, 0.15)" stroke="#c084fc" stroke-width="0.6"/>
  <text x="189" y="121" class="badge-txt" fill="#c084fc">MERGE</text>
  <text x="248" y="121" class="log-repo">Top-Globales</text>
  <text x="365" y="121" class="log-sha">38261a3</text>
  <text x="435" y="121" class="log-msg">Merge pull request #1 from Kekkan74/copilot/set-r...</text>
  <rect x="24" y="132" width="812" height="21" rx="4" fill="#0d141f" opacity="0.4"/>
  <text x="28" y="146" class="log-date">2026-05-17 14:14</text>
  <rect x="160" y="135" width="58" height="15" rx="3" fill="rgba(0, 229, 255, 0.15)" stroke="#00e5ff" stroke-width="0.6"/>
  <text x="189" y="146" class="badge-txt" fill="#00e5ff">SYNC</text>
  <text x="248" y="146" class="log-repo">Top-Globales</text>
  <text x="365" y="146" class="log-sha">3512a89</text>
  <text x="435" y="146" class="log-msg">chore: move project files to repository root</text>
  <rect x="24" y="157" width="812" height="21" rx="4" fill="#0d141f" opacity="0.4"/>
  <text x="28" y="171" class="log-date">2026-02-23 12:29</text>
  <rect x="160" y="160" width="58" height="15" rx="3" fill="rgba(255, 189, 46, 0.15)" stroke="#ffbd2e" stroke-width="0.6"/>
  <text x="189" y="171" class="badge-txt" fill="#ffbd2e">CONFIG</text>
  <text x="248" y="171" class="log-repo">dotfiles</text>
  <text x="365" y="171" class="log-sha">a43050e</text>
