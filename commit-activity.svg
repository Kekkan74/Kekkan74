  <text x="248" y="196" class="log-repo">dotfiles</text>
  <text x="365" y="196" class="log-sha">0e5fdfe</text>
  <text x="435" y="196" class="log-msg">Revert &quot;My identity for @lewagon in the gitconfig&quot;</text>
  <rect x="24" y="207" width="812" height="21" rx="4" fill="#0d141f" opacity="0.4"/>
  <text x="28" y="221" class="log-date">2025-03-06 22:56</text>
  <rect x="160" y="210" width="58" height="15" rx="3" fill="rgba(56, 189, 248, 0.15)" stroke="#38bdf8" stroke-width="0.6"/>
  <text x="189" y="221" class="badge-txt" fill="#38bdf8">DOCS</text>
  <text x="248" y="221" class="log-repo">apuntesPython</text>
  <text x="365" y="221" class="log-sha">6d35cf5</text>
  <text x="435" y="221" class="log-msg">CLASE 3</text>
  <line x1="24" y1="261" x2="836" y2="261" stroke="#1f2937" stroke-width="0.8"/>
  <text x="28" y="275"><tspan class="bottom-cmd">kekkan74@soc-node:~$ </tspan><tspan fill="#e2e8f0" font-family="JetBrains Mono, monospace" font-size="10px">git telemetry --integrity-check: 0 defects, defense perimeter active.</tspan><tspan fill="#00ff66" class="cursor-blink"> █</tspan></text>
</svg>
