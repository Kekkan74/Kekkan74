  <line x1="24" y1="272" x2="836" y2="272" stroke="#1f2937" stroke-width="0.8"/>
  <text x="28" y="286"><tspan class="bottom-cmd">kekkan74@soc-node:~$ </tspan><tspan class="bottom-dim">git stream-audit: 0 defects, defense perimeter nominal.</tspan><tspan fill="#00ff66" class="cursor-blink"> █</tspan></text>
</svg>
