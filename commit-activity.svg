  <rect x="24" y="226" width="812" height="20" rx="3" fill="#0d141f" opacity="0.45"/>
  <text x="28" y="240" class="log-date">2025-12-02 09:42</text>
  <rect x="160" y="229.5" width="58" height="14" rx="3" fill="rgba(255, 189, 46, 0.15)" stroke="#ffbd2e" stroke-width="0.6"/>
  <text x="189" y="240" class="badge-txt" fill="#ffbd2e">CONFIG</text>
  <text x="248" y="240" class="log-repo">dotfiles</text>
  <text x="365" y="240" class="log-sha">0e5fdfe</text>
