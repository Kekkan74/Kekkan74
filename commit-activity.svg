  <rect x="24" y="178" width="812" height="20" rx="3" fill="#0d141f" opacity="0.45"/>
  <text x="28" y="192" class="log-date">2026-05-17 14:14</text>
  <rect x="160" y="181.5" width="58" height="14" rx="3" fill="rgba(0, 229, 255, 0.15)" stroke="#00e5ff" stroke-width="0.6"/>
  <text x="189" y="192" class="badge-txt" fill="#00e5ff">SYNC</text>
  <text x="248" y="192" class="log-repo">Top-Globales</text>
  <text x="365" y="192" class="log-sha">3512a89</text>
  <text x="435" y="192" class="log-msg">chore: move project files to repository root</text>
  <rect x="24" y="202" width="812" height="20" rx="3" fill="#0d141f" opacity="0.45"/>
  <text x="28" y="216" class="log-date">2026-02-23 12:29</text>
  <rect x="160" y="205.5" width="58" height="14" rx="3" fill="rgba(255, 189, 46, 0.15)" stroke="#ffbd2e" stroke-width="0.6"/>
  <text x="189" y="216" class="badge-txt" fill="#ffbd2e">CONFIG</text>
  <text x="248" y="216" class="log-repo">dotfiles</text>
  <text x="365" y="216" class="log-sha">a43050e</text>
