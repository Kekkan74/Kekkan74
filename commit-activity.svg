<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 300" width="100%" height="100%">
  <defs>
    <linearGradient id="term-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e14"/>
      <stop offset="100%" stop-color="#05080c"/>
    </linearGradient>
    <linearGradient id="term-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.45"/>
      <stop offset="50%" stop-color="#1f2937" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#00ff66" stop-opacity="0.45"/>
    </linearGradient>
    <linearGradient id="hud-bg-mini" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#111823"/>
      <stop offset="100%" stop-color="#0b1017"/>
    </linearGradient>
  </defs>
  <style>
    .terminal-bg { fill: url(#term-bg); stroke: url(#term-border); stroke-width: 1.5; rx: 10; }
    .header-bar  { fill: #111822; }
    .header-title { font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace; font-size: 11.5px; fill: #6b7280; font-weight: 600; }
    .dot-red    { fill: #ff5f56; }
    .dot-yellow { fill: #ffbd2e; }
    .dot-green  { fill: #27c93f; }

    .pulse-dot {
      animation: blinkDot 1.8s infinite;
    }
    @keyframes blinkDot {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.25; }
    }

    .cursor-blink {
      animation: blinkCursor 1s infinite;
    }
    @keyframes blinkCursor {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    .hud-box    { fill: url(#hud-bg-mini); stroke: #1e293b; stroke-width: 0.8; rx: 5; }
    .hud-title  { font-family: 'JetBrains Mono', monospace; font-size: 8.5px; fill: #64748b; font-weight: 700; letter-spacing: 0.6px; }
    .hud-val-c  { font-family: 'JetBrains Mono', monospace; font-size: 12px; fill: #00e5ff; font-weight: 800; }
    .hud-val-g  { font-family: 'JetBrains Mono', monospace; font-size: 12px; fill: #00ff66; font-weight: 800; }
    .hud-val-p  { font-family: 'JetBrains Mono', monospace; font-size: 12px; fill: #c084fc; font-weight: 800; }
    .hud-val-y  { font-family: 'JetBrains Mono', monospace; font-size: 12px; fill: #ffbd2e; font-weight: 800; }

    .col-header { font-family: 'JetBrains Mono', monospace; font-size: 9px; fill: #475569; font-weight: 700; letter-spacing: 0.6px; }
    .log-date   { font-family: 'JetBrains Mono', monospace; font-size: 10px; fill: #94a3b8; }
    .log-repo   { font-family: 'JetBrains Mono', monospace; font-size: 10px; fill: #f1f5f9; font-weight: 700; }
    .log-sha    { font-family: 'JetBrains Mono', monospace; font-size: 10px; fill: #64748b; font-weight: 600; }
    .log-msg    { font-family: 'JetBrains Mono', monospace; font-size: 10px; fill: #cbd5e1; }

    .badge-txt  { font-family: 'JetBrains Mono', monospace; font-size: 8.5px; font-weight: 700; text-anchor: middle; }
    .bottom-cmd { font-family: 'JetBrains Mono', monospace; font-size: 9.5px; fill: #00ff66; }
    .bottom-dim { font-family: 'JetBrains Mono', monospace; font-size: 9.5px; fill: #64748b; }
  </style>
  <rect x="2" y="2" width="856" height="296" class="terminal-bg"/>
  <path d="M 2 12 C 2 6 6 2 12 2 L 848 2 C 854 2 858 6 858 12 L 858 32 L 2 32 Z" class="header-bar"/>
  <circle cx="18" cy="17" r="5" class="dot-red"/>
  <circle cx="33" cy="17" r="5" class="dot-yellow"/>
  <circle cx="48" cy="17" r="5" class="dot-green"/>
  <text x="430" y="21" text-anchor="middle" class="header-title">kekkan74@soc-node: ~ (tail -f /var/log/audit/git_events.log)</text>
  <circle cx="760" cy="17" r="3.5" fill="#00e5ff" class="pulse-dot"/>
  <text x="770" y="20.5" font-family="JetBrains Mono, monospace" font-size="9px" fill="#00e5ff" font-weight="700">AUDIT_FEED</text>
  <rect x="24" y="42" width="192" height="32" class="hud-box"/>
  <text x="34" y="55" class="hud-title">MONITORED TARGETS</text>
  <text x="34" y="68" class="hud-val-c">5 REPOSITORIES</text>
  <rect x="230" y="42" width="192" height="32" class="hud-box"/>
  <text x="240" y="55" class="hud-title">CI/CD PIPELINE</text>
  <text x="240" y="68" class="hud-val-g">🟢 100% AUTONOMOUS</text>
  <rect x="436" y="42" width="192" height="32" class="hud-box"/>
  <text x="446" y="55" class="hud-title">TELEMETRY PARSER</text>
  <text x="446" y="68" class="hud-val-p">ZERO-TOKEN PARSED</text>
  <rect x="642" y="42" width="194" height="32" class="hud-box"/>
  <text x="652" y="55" class="hud-title">DEFENSE NODE</text>
  <text x="652" y="68" class="hud-val-y">ACTIVE THREAT RADAR</text>
  <line x1="24" y1="80" x2="836" y2="80" stroke="#1f2937" stroke-width="0.8"/>
  <text x="28"  y="92" class="col-header">TIMESTAMP (UTC)</text>
  <text x="168" y="92" class="col-header">EVENT</text>
  <text x="248" y="92" class="col-header">REPOSITORY</text>
  <text x="365" y="92" class="col-header">SHA</text>
  <text x="435" y="92" class="col-header">PAYLOAD / AUDIT COMMIT MESSAGE</text>
  <line x1="24" y1="98" x2="836" y2="98" stroke="#1e293b" stroke-width="0.8"/>
  <rect x="24" y="106" width="812" height="20" rx="3" fill="#0d141f" opacity="0.45"/>
  <text x="28" y="120" class="log-date">2026-10-29 21:56</text>
  <rect x="160" y="109.5" width="58" height="14" rx="3" fill="rgba(0, 255, 102, 0.15)" stroke="#00ff66" stroke-width="0.6"/>
  <text x="189" y="120" class="badge-txt" fill="#00ff66">FEAT</text>
  <text x="248" y="120" class="log-repo">PokeStat</text>
  <text x="365" y="120" class="log-sha">ba0e053</text>
  <text x="435" y="120" class="log-msg">feat: initial release of PokeStat Gen 9 &amp; Randoml...</text>
  <rect x="24" y="130" width="812" height="20" rx="3" fill="#0d141f" opacity="0.45"/>
  <text x="28" y="144" class="log-date">2026-10-29 05:09</text>
  <rect x="160" y="133.5" width="58" height="14" rx="3" fill="rgba(0, 229, 255, 0.15)" stroke="#00e5ff" stroke-width="0.6"/>
  <text x="189" y="144" class="badge-txt" fill="#00e5ff">SYNC</text>
  <text x="248" y="144" class="log-repo">Kekkan74</text>
  <text x="365" y="144" class="log-sha">9bcecb6</text>
  <text x="435" y="144" class="log-msg">chore(profile): daily heatmap &amp; telemetry refresh...</text>
  <rect x="24" y="154" width="812" height="20" rx="3" fill="#0d141f" opacity="0.45"/>
  <text x="28" y="168" class="log-date">2026-05-17 14:16</text>
  <rect x="160" y="157.5" width="58" height="14" rx="3" fill="rgba(192, 132, 252, 0.15)" stroke="#c084fc" stroke-width="0.6"/>
  <text x="189" y="168" class="badge-txt" fill="#c084fc">MERGE</text>
  <text x="248" y="168" class="log-repo">Top-Globales</text>
